<!doctype html>
<html lang="zh-Hant" dark>
  <head>
    <meta charset="utf-8">
    <base href="/">
    <link rel="canonical" href="https://www.youtube.com/channel/UCMattsCanonical">
    <link rel="stylesheet" href="/extension/content/content.css">
    <style>
      body { margin: 40px; color: #f1f1f1; background: #0f0f0f; font-family: Arial, sans-serif; }
      yt-page-header-view-model, .ytPageHeaderViewModelHeadlineInfo, yt-flexible-actions-view-model { display: block; }
      yt-flexible-actions-view-model { display: flex; align-items: center; gap: 10px; }
      .ytFlexibleActionsViewModelAction { display: block; }
      button { min-width: 90px; height: 40px; }
    </style>
    <script>
      history.replaceState({}, "", "/@mattsgamenight");
      const listeners = [];
      let storedState = {
        version: 14,
        revision: 0,
        groups: [
          { id: "gaming", name: "Gaming", icon: "game", color: "#2dbd9b", channelIds: ["/channel/ucmattscanonical"] },
          { id: "learning", name: "Learning", icon: "book", color: "#7c5cff", channelIds: [] }
        ],
        channels: {
          "/@mattsgamenight": { id: "/@mattsgamenight", name: "Matt's Game Night", url: "https://www.youtube.com/@mattsgamenight" },
          "/channel/ucmattscanonical": { id: "/channel/ucmattscanonical", name: "Matt's Game Night", url: "https://www.youtube.com/channel/UCMattsCanonical" }
        },
        manualLabels: {},
        settings: { blockHome: false, hideShorts: false, hideSecondary: false, disableAutoplay: false, hideWatched: false, compactMode: false, onboardingComplete: true, language: "en" }
      };
      globalThis.__getStoredState = () => structuredClone(storedState);
      globalThis.__setStoredState = (next) => {
        const oldValue = structuredClone(storedState);
        storedState = structuredClone(next);
        listeners.forEach((listener) => listener({ chanlumeState: { oldValue, newValue: structuredClone(storedState) } }, "local"));
      };
      globalThis.chrome = {
        storage: {
          local: {
            get: async () => ({ chanlumeState: storedState }),
            set: async () => {}
          },
          onChanged: { addListener: (listener) => listeners.push(listener) }
        },
        runtime: {
          sendMessage: async (message) => {
            if (message.type !== "CHANLUME_MUTATE") return { ok: true };
            storedState = ChanlumeCore.applyStateOperation(storedState, message.operation);
            storedState.revision += 1;
            return { ok: true, state: ChanlumeCore.normalizeState(storedState) };
          },
          onMessage: { addListener: () => {} }
        }
      };
    </script>
  </head>
  <body>
    <yt-page-header-view-model>
      <a href="/@mattsgamenight"><h1>Matt's Game Night</h1></a>
      <yt-content-metadata-view-model></yt-content-metadata-view-model>
      <div class="ytPageHeaderViewModelHeadlineInfo">
        <yt-flexible-actions-view-model>
          <div class="ytFlexibleActionsViewModelAction">
            <yt-subscribe-button-view-model subscribed><button aria-label="Unsubscribe from Matt's Game Night">Subscribed</button></yt-subscribe-button-view-model>
          </div>
          <div class="ytFlexibleActionsViewModelAction"><button>Join</button></div>
        </yt-flexible-actions-view-model>
      </div>
    </yt-page-header-view-model>
    <yt-lockup-view-model id="unrelated-video"><yt-content-metadata-view-model><div class="ytContentMetadataViewModelMetadataRow">Unrelated video metadata</div></yt-content-metadata-view-model></yt-lockup-view-model>
    <script src="/extension/shared.js"></script>
    <script src="/extension/content/favorites.js"></script>
    <script src="/extension/content/content.js"></script>
    <script>
      setTimeout(() => {
        const row = document.createElement("div");
        row.className = "ytContentMetadataViewModelMetadataRow";
        row.textContent = "@mattsgamenight · 42K subscribers";
        document.querySelector("yt-content-metadata-view-model").append(row);
      }, 80);
    </script>
  </body>
</html>
