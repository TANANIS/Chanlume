<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chanlume 訂閱更新測試</title>
    <style>
      body { margin:0; color:#f1f1f1; background:#0f0f0f; font:14px Arial,sans-serif; }
      main { width:min(900px,calc(100% - 40px)); margin:auto; padding:40px 0; }
      h1 { font-size:24px; }
      ytd-channel-renderer { min-height:120px; display:flex; align-items:center; gap:18px; border-bottom:1px solid #2c2c2c; }
      .avatar { width:68px; height:68px; border-radius:50%; background:linear-gradient(135deg,#785fe5,#392e6a); }
      a { color:#f1f1f1; font-size:16px; text-decoration:none; }
    </style>
    <link rel="stylesheet" href="/extension/content/content.css" />
  </head>
  <body><main><h1>所有訂閱頻道</h1><div id="channels"></div></main>
    <script>
      const names = ["Kurzgesagt", "Veritasium", "Lofi Girl", "Game Maker's Toolkit", "報導者", "Ninomae Ina'nis"];
      document.getElementById("channels").innerHTML = names.map((name,index) => `<ytd-channel-renderer><span class="avatar"></span><a id="channel-title" href="/@demo${index}">${name}</a></ytd-channel-renderer>`).join("");
      window.savedState = null;
      window.scanMessages = [];
      const initialState = {version:1,channels:{"/@gone":{id:"/@gone",name:"Gone"}},groups:[{id:"learning",name:"學習",icon:"book",color:"#7c5cff",channelIds:["/@gone"]}],settings:{hideShorts:false,hideWatched:false,compactMode:false}};
      window.chrome={storage:{local:{get:async()=>({chanlumeState:initialState}),set:async(value)=>{if(value.chanlumeState)window.savedState=value.chanlumeState;}},onChanged:{addListener:()=>{}}},runtime:{sendMessage:async(message)=>{window.scanMessages.push(message);return{ok:true};},onMessage:{addListener:()=>{}}}};
    </script>
    <script src="/extension/shared.js"></script><script src="/extension/content/content.js"></script>
  </body>
</html>
