<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{width:440px;height:280px;margin:0;overflow:hidden}body{position:relative;display:flex;align-items:center;padding:35px;color:#fff;background:radial-gradient(circle at 88% 18%,#5035a8 0,transparent 38%),linear-gradient(135deg,#121018,#1c1730);font-family:Arial,sans-serif}.copy{width:260px;z-index:2}.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;font-weight:800;font-size:16px}.brand img{width:42px;height:42px}.eyebrow{color:#ad9bff;font-size:11px;font-weight:800;letter-spacing:.18em}.title{margin:8px 0 10px;font-size:29px;line-height:1.02;letter-spacing:-.04em}.subtitle{margin:0;color:#c8c2d4;font-size:13px;line-height:1.45}.shelves{position:absolute;right:19px;top:50px;width:128px;height:180px}.card{position:absolute;width:108px;height:54px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.08);box-shadow:0 18px 40px rgba(0,0,0,.25);backdrop-filter:blur(8px)}.card:before{content:"";position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:10px;background:#7658ee}.card:after{content:"";position:absolute;left:52px;right:12px;top:17px;height:6px;border-radius:6px;background:rgba(255,255,255,.75);box-shadow:0 13px 0 rgba(255,255,255,.22)}.one{top:0;transform:rotate(5deg)}.two{top:62px;left:10px;transform:rotate(-4deg)}.two:before{background:#ff6b8a}.three{top:124px;transform:rotate(3deg)}.three:before{background:#2dbd9b}
  </style>
</head>
<body><div class="copy"><div class="brand"><img src="../extension/icons/icon-128.png" alt="">Chanlume</div><div class="eyebrow">YOUR YOUTUBE, ORGANIZED</div><h1 class="title">Subscriptions without the clutter.</h1><p class="subtitle">Local groups, smarter filters, and fewer distractions.</p></div><div class="shelves"><div class="card one"></div><div class="card two"></div><div class="card three"></div></div></body>
</html>
